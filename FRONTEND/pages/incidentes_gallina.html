<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">

        <!-- ================= HEADER ================= -->
        <style>
          /* Botones responsive en móvil */
          @media (max-width: 575px) {
            .header-buttons-container {
              width: 100%;
            }
            .header-buttons-mobile {
              display: flex;
              width: 100%;
              gap: 0.5rem;
            }
            .header-buttons-mobile .btn,
            .header-buttons-mobile .btn-group {
              flex: 1;
              min-width: 0;
            }
            .header-buttons-mobile .btn {
              padding: 0.5rem 0.25rem;
              font-size: 1.1rem;
              display: flex;
              align-items: center;
              justify-content: center;
            }
            .header-buttons-mobile .btn i {
              margin: 0 !important;
            }
            
            /* Centrar mensaje de selección de galpón */
            .galpon-empty-message {
              text-align: center;
              padding: 2rem 1rem;
            }
            
            /* Filtro galpón en móvil - ancho completo */
            .galpon-filter-mobile {
              width: 100%;
              max-width: 100% !important;
            }
          }
          
          /* Centrar select en móvil */
          @media (max-width: 767px) {
            #filter-galpon-inci option {
              text-align: center;
            }
            #filter-galpon-inci {
              text-align: center;
              text-align-last: center;
            }
          }
        </style>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-2">
          <h4 class="card-title mb-0">Incidente Gallina</h4>
          
          <div class="d-flex flex-column flex-sm-row flex-wrap gap-2 align-items-stretch align-items-sm-center w-100 w-md-auto justify-content-md-end header-buttons-container">
            
            <!-- Filtro Galpón -->
            <div class="input-group input-group-sm galpon-filter-mobile" style="max-width: 280px; flex: 1 1 auto;">
              <span class="input-group-text">Galpón</span>
              <select id="filter-galpon-inci" class="form-select">
                <option value="" disabled selected>
                  Seleccione un galpón
                </option>
              </select>
            </div>
            
            <!-- Botones en fila en móvil -->
            <div class="d-flex gap-2 header-buttons-mobile">
              <!-- Aislamiento -->
              <button
                class="btn btn-outline-success btn-sm text-nowrap flex-shrink-0"
                onclick="loadContent('aislamientos')"
              >
                <i class="fa-solid fa-kit-medical"></i>
                <span class="d-none d-sm-inline ms-1">Aislamiento</span>
              </button>

              <!-- Exportar -->
              <div class="btn-group flex-shrink-0">
                <button
                  class="btn btn-outline-secondary btn-sm dropdown-toggle"
                  type="button"
                  id="export-btn"
                  data-bs-toggle="dropdown"
                >
                  <i class="fa fa-file-export"></i>
                  <span class="d-none d-sm-inline ms-1">Exportar</span>
                </button>

                <ul class="dropdown-menu">
                  <li>
                    <a
                      class="dropdown-item export-format"
                      href="#"
                      data-format="csv"
                    >
                      Exportar CSV
                    </a>
                  </li>
                  <li>
                    <a
                      class="dropdown-item export-format"
                      href="#"
                      data-format="excel"
                    >
                      Exportar Excel
                    </a>
                  </li>
                  <li>
                    <a
                      class="dropdown-item export-format"
                      href="#"
                      data-format="pdf"
                    >
                      Exportar PDF
                    </a>
                  </li>
                </ul>
              </div>

              <!-- Agregar -->
              <button
                type="button"
                class="btn btn-success btn-sm flex-shrink-0"
                data-bs-toggle="modal"
                data-bs-target="#createIncidenteGallinaModal"
              >
                <i class="fas fa-plus"></i>
                <span class="d-none d-sm-inline ms-1">Agregar</span>
              </button>
            </div>
            
          </div>
        </div>



        <!-- ================= FILTROS DE FECHA ================= -->
        <div id="filters" class="row g-2 my-3">

          <div class="col-12 col-md-3">
            <div class="input-group input-group-sm">
              <span class="input-group-text">
                <i class="fas fa-search"></i>
              </span>
              <input
                type="text"
                id="search-incidente-gallina"
                class="form-control"
                placeholder="Buscar incidente"
              />
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-3">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Fecha inicio</span>
              <input
                type="date"
                id="fecha-inicio"
                class="form-control"
              />
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-3">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Fecha fin</span>
              <input
                type="date"
                id="fecha-fin"
                class="form-control"
              />
            </div>
          </div>

          <div class="col-12 col-md-3">
            <div class="d-flex gap-2">
              <button
                class="btn btn-success btn-sm flex-fill"
                id="btn-apply-date-filter"
              >
                <i class="fas fa-filter me-1"></i>
                Filtrar
              </button>

              <button
                class="btn btn-secondary btn-sm flex-fill"
                id="btn_clear_filters"
              >
                <i class="fas fa-times-circle me-1"></i>
                Limpiar
              </button>
            </div>
          </div>

        </div>

        <!-- ================= TABLA ================= -->
        <style>
          /* En celular y tablet: scroll horizontal */
          @media (max-width: 991px) {
            .table-responsive {
              overflow-x: auto;
              -webkit-overflow-scrolling: touch;
            }
            
            .responsive-table {
              min-width: 800px;
            }
            
            .responsive-table th,
            .responsive-table td {
              white-space: nowrap;
            }
          }
          
          /* Solo en desktop (992px en adelante): tabla adaptable */
          @media (min-width: 992px) {
            .responsive-table {
              width: 100%;
              table-layout: fixed;
            }
            
            .responsive-table th,
            .responsive-table td {
              /* padding: 0.5rem 0.75rem !important; */
              white-space: nowrap;
            }
            
            /* Espacio entre botones de acciones */
            .responsive-table td:nth-child(7) .btn,
            .responsive-table td:nth-child(7) button {
              margin: 0 0.25rem;
            }
            
            /* Anchos específicos para cada columna */
            .responsive-table th:nth-child(1),
            .responsive-table td:nth-child(1) {
              width: 15%;
            }
            
            .responsive-table th:nth-child(2),
            .responsive-table td:nth-child(2) {
              width: 16%;
            }
            
            .responsive-table th:nth-child(3),
            .responsive-table td:nth-child(3) {
              width: 9%;
              text-align: center;
            }
            
            .responsive-table th:nth-child(4),
            .responsive-table td:nth-child(4) {
              width: 15%;
              white-space: normal;
              word-break: break-word;
            }
            
            .responsive-table th:nth-child(5),
            .responsive-table td:nth-child(5) {
              width: 13%;
              white-space: normal !important;
              line-height: 1.5;
              vertical-align: middle;
            }
            
            .responsive-table th:nth-child(6),
            .responsive-table td:nth-child(6) {
              width: 17%;
            }
            
            .responsive-table th:nth-child(7),
            .responsive-table td:nth-child(7) {
              width: 15%;
            }
          }
        </style>

        <div class="table-responsive">
          <table class="table table-striped table-hover table-sm align-middle mb-0 responsive-table">
            <thead>
              <tr>
                <th>Galpón origen</th>
                <th>Tipo de incidente</th>
                <th>Cantidad</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Fecha y hora</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="incidente-gallina-table-body"></tbody>
          </table>

        </div>

      </div>
    </div>
  </div>
</div>

<!-- ================= PAGINACIÓN ================= -->
<div class="row">
  <div class="col-12">
    <nav class="mt-3">
      <ul
        id="pagination"
        class="pagination justify-content-center flex-wrap"
      ></ul>
    </nav>
  </div>
</div>

<!-- ================= MODAL EDITAR ================= -->
<div
  class="modal fade"
  id="editIncidenteGallinaModal"
  tabindex="-1"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Incidente Gallina</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body">
        <form id="edit-incidente-gallina-form">
          <input
            type="hidden"
            id="edit-id_inc_gallina"
          />

          <div class="mb-3">
            <label class="form-label">Galpón</label>
            <select
              id="edit_id_galpon"
              class="form-select"
              required
            ></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Tipo de Incidente</label>
            <select
              id="edit-tipo_incidente"
              class="form-select"
              required
            ></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input
              type="number"
              class="form-control"
              id="edit-cantidad"
              min="0"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea
              class="form-control"
              id="edit-descripcion"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="btn btn-primary"
            >
              Aceptar
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<!-- ================= MODAL CREAR ================= -->
<div
  class="modal fade"
  id="createIncidenteGallinaModal"
  tabindex="-1"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Agregar Incidente Gallina</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body">
        <form id="create-incidente-gallina-form">

          <div class="mb-3">
            <label class="form-label">Galpón</label>
            <select
              id="create_id_galpon"
              class="form-select"
              required
            ></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Tipo de Incidente</label>
            <select
              id="tipo_incidente_create"
              class="form-select"
              required
            ></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input
              type="number"
              class="form-control"
              id="cantidad"
              min="0"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea
              class="form-control"
              id="description"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="btn btn-primary"
            >
              Agregar
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
