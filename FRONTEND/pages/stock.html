<!-- Row 1 -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Stock</h4>

                <!-- Gráficas -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-lg-6">
                        <div id="chart" style="max-width:100%;"></div>
                    </div>
                    <div class="col-12 col-lg-6">
                        <div id="donutChart" style="max-width:100%;"></div>
                    </div>
                </div>

                <!-- Resumen -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3">Resumen de Inventario</h6>
                        <p id="productoMayor">Cargando...</p>
                        <p id="productoMenor">Cargando...</p>
                    </div>
                </div>

                <!-- Tabla -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm mb-0 text-nowrap align-middle">
                        <thead>
                            <tr>
                                <th class="">Tipo</th>
                                <th class="">Unidad Medida</th>
                                <th class="">Nombre Producto</th>
                                <th class="">Cantidad Disponible</th>
                            </tr>
                        </thead>
                        <tbody id="stock-table-body"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
