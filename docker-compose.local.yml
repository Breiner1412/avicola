# Solo para desarrollo: publica los puertos en tu equipo (127.0.0.1).
# Uso: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Crea su propia red "proxy" si no tienes Caddy en tu equipo.
services:
  db:
    ports:
      - "127.0.0.1:${DB_PUERTO_HOST:-3308}:3306"
  api:
    ports:
      - "127.0.0.1:${API_PUERTO_HOST:-8000}:8000"
  web:
    ports:
      - "127.0.0.1:${WEB_PUERTO_HOST:-3000}:3000"

networks:
  proxy:
    external: false
    name: avicola_proxy_local
